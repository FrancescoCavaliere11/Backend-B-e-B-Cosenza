[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers

# I test asincroni non richiedono la marcatura esplicita: ogni `async def test_`
# viene eseguito da pytest-asyncio.
asyncio_mode = auto

# Le fixture con accesso al database sono a scope *function*: lo schema del
# database di test viene ricreato a ogni test. È più lento, ma evita i
# disallineamenti di event loop fra fixture di scope diverso, che cambiano da
# una versione di pytest-asyncio all'altra.
